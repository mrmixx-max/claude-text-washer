# LLM Backend Profiles for claude-text-washer
# Use --backend <name> to select, or pass --base-url directly.
# Auto-detection works for most providers — set backend_type only if needed.

default_backend: ollama-local

backends:
  ollama-local:
    type: ollama
    base_url: http://127.0.0.1:11434/api/generate
    stream_url: http://127.0.0.1:11434/api/generate
    api_key: null

  vllm:
    type: openai
    base_url: http://localhost:8000/v1/chat/completions
    api_key: null

  lm-studio:
    type: openai
    base_url: http://localhost:1234/v1/chat/completions
    api_key: null

  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY

  together:
    type: openai
    base_url: https://api.together.xyz/v1/chat/completions
    api_key_env: TOGETHER_API_KEY

  groq:
    type: openai
    base_url: https://api.groq.com/openai/v1/chat/completions
    api_key_env: GROQ_API_KEY

  openai:
    type: openai
    base_url: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY

  anthropic:
    type: openai
    base_url: https://api.anthropic.com/v1/messages
    api_key_env: ANTHROPIC_API_KEY
